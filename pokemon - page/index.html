<!DOCTYPE html>
<html>

<head>
  <script src="script.js"></script>
  <link rel="stylesheet" href="style.css">
</head>

<body onload="getRandomPokemon()">

  <h1>Pokémon Page</h1>

  <p id="welcomeText">
    Welcome! This page uses the PokéAPI to show you information about Pokémon.
    Every time you refresh the page, a random Pokémon is shown.
    Click "Generate another Pokémon" to see a new one, or search for a Pokémon by its name or number.
  </p>

  <form id="searchForm" action="" onsubmit="searchPokemon(); return false;">
    <label for="searchInput">Search for a Pokémon:</label>
    <input type="text" id="searchInput">
    <input type="button" value="Search" onclick="searchPokemon()">
  </form>

  <br><br>

  <div id="pokemonCard"></div>

  <br>

  <input type="button" value="Generate another Pokémon" onclick="getRandomPokemon()">

</body>

</html>
